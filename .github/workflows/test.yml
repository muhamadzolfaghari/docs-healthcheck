name: Test & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-healthcheck-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate browser playground
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/index.html
          test -s docs/styles.css
          test -s docs/app.js
          node --check docs/app.js
          grep -q "docs-healthcheck Playground" docs/index.html
          grep -q "Fix SAFE issues" docs/index.html

      - name: Verify healthy demo repository
        run: node ./bin/docs-healthcheck.js demo/healthy-docs --ci --min-score 90

      - name: Verify broken demo repository is rejected
        run: node -e "const {spawnSync}=require('node:child_process'); const r=spawnSync(process.execPath,['./bin/docs-healthcheck.js','demo/broken-docs','--ci'],{stdio:'inherit'}); if (r.status===0) { console.error('Broken demo unexpectedly passed'); process.exit(1); } console.log('Broken demo correctly rejected with exit code '+r.status);"

      - name: Run test suite with coverage
        run: npm run test:coverage

      - name: Run Repair Smoke Test
        run: |
          node -e "const fs=require('node:fs'); const {execSync}=require('node:child_process'); const tmp='/tmp/docs-healthcheck-smoke-test'; fs.rmSync(tmp,{recursive:true,force:true}); fs.cpSync('demo/fixable-docs',tmp,{recursive:true}); execSync('node ./bin/docs-healthcheck.js fix '+tmp+' --yes',{stdio:'inherit'}); execSync('node ./bin/docs-healthcheck.js '+tmp+' --ci --min-score 85',{stdio:'inherit'});"

      - name: Run Self Health Check
        run: node ./bin/docs-healthcheck.js . --ci

