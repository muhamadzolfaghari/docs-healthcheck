name: Publish to npm

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build package
        run: npm run build

      - name: Run test suite
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Check npm publication state
        id: npm
        shell: bash
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${VERSION} is already published; skipping publish and validating registry/CLI."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${VERSION} is not published yet."
          fi

      - name: Publish to npm with OIDC trusted publishing
        if: steps.npm.outputs.published != 'true'
        run: npm publish --provenance --access public

      - name: Post-Publish Registry & CLI Validation Smoke Test
        shell: bash
        run: |
          set -euo pipefail

          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          echo "Waiting for $NAME@$VERSION to become visible on npm..."
          registry_ready=false
          for attempt in {1..30}; do
            if npm view "${NAME}@${VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              registry_ready=true
              echo "✅ npm registry verified"
              break
            fi
            echo "Registry not ready yet (attempt ${attempt}/30)"
            sleep 10
          done

          if [ "${registry_ready}" != "true" ]; then
            echo "::error::${NAME}@${VERSION} did not become visible on npm within the validation window"
            exit 1
          fi

          TMP_DIR=$(mktemp -d)
          cd "$TMP_DIR"
          npm init -y >/dev/null
          npm install --silent "${NAME}@${VERSION}"

          ACTUAL=$(npx --no-install docs-healthcheck --version)
          test "$ACTUAL" = "$VERSION"

          npx --no-install docs-healthcheck --help >/dev/null
          npx --no-install docs-healthcheck lint --help >/dev/null
          npx --no-install docs-healthcheck fix --help >/dev/null
          npx --no-install docs-healthcheck revert --help >/dev/null

          echo "✅ Fresh install verified: docs-healthcheck $ACTUAL"
          echo "🎉 Post-publish registry & CLI validation passed"
